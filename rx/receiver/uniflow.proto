syntax = "proto3";

package uniflow;

message UniflowPacket {
  string file_name = 1;
  uint32 block_id = 2;
  uint32 packet_index = 3;
  enum PacketType { DATA = 0; PARITY = 1; }
  PacketType type = 4;
  bytes payload = 5;
  uint32 payload_size = 6;
  uint32 total_blocks = 7;
  bytes file_hash = 8;
  uint32 crc32 = 9;
  uint64 file_size = 10;
}
