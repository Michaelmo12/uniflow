syntax = "proto3";

package uniflow;

message UniflowPacket {
  string file_name = 1;

  uint32 block_id      = 2;  // which FEC block this packet belongs to
  uint32 packet_index  = 3;  // position within the block

  enum PacketType {
    DATA   = 0;
    PARITY = 1;
  }
  PacketType type = 4;

  bytes  payload      = 5;  // file data, or FEC parity bytes
  uint32 payload_size = 6;  // real byte count (last packet in a block may be smaller)

  uint32 total_blocks = 7;  // lets Receiver know when the whole file has arrived
  bytes  file_hash    = 8;  // SHA-256 digest (32 raw bytes) of the original file
  uint32 crc32        = 9;  // checksum over payload only
}